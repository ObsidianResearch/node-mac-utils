name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci --ignore-scripts
      - name: Use the runner's Visual Studio
        if: runner.os == 'Windows'
        shell: bash
        run: echo "GYP_MSVS_VERSION=2022" >> "$GITHUB_ENV" 
      - name: Build against Node
        run: npx --yes node-gyp@11 rebuild
      - name: Smoke test the render-device functions
        run: node test-render-devices.js
      - name: Build against Electron 42 headers (the version the adviser app ships)
        run: npx --yes node-gyp@11 rebuild --target=42.11.10 --dist-url=https://electronjs.org/headers
